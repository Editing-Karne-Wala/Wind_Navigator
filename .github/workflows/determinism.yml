name: Determinism Cross-Platform Matrix

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  determinism_audit:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # Crucial for Phase 34: We test Native ARM64 (macOS), AMD/Intel x86_64 (Ubuntu), and Windows Core
        os: [ubuntu-latest, macos-latest, windows-latest]
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python 3.12
      uses: actions/setup-python@v4
      with:
        python-version: "3.12"
        
    - name: Run Intensive D2Q9 Vortex Burn-in & Cryptographic Hash
      run: python test_determinism.py
      
    - name: Verify Architecture Independence
      run: echo "Execution completed. If the SHA-256 matches across all 3 matrix jobs, Gap D4 is formally closed."
